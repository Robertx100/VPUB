{% if status == "success" %}
<div class="p-4 rounded-xl bg-sage-50 dark:bg-sage-950/60 border border-sage-300 dark:border-sage-700/80 text-sage-900 dark:text-sage-200 flex items-start gap-3 shadow-sm animate-fade-in" role="alert">
  <svg class="w-5 h-5 text-sage-600 dark:text-sage-400 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
  </svg>
  <div>
    <p class="font-semibold text-sm">{{ message }}</p>
    <p class="text-xs text-sage-700 dark:text-sage-400 mt-1">We'll send exclusive progress updates and beta invites straight to your inbox.</p>
  </div>
</div>
{% else %}
<div class="p-4 rounded-xl bg-red-50 dark:bg-red-950/60 border border-red-300 dark:border-red-800 text-red-900 dark:text-red-200 flex items-start gap-3 shadow-sm" role="alert">
  <svg class="w-5 h-5 text-red-600 dark:text-red-400 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
  </svg>
  <div>
    <p class="font-semibold text-sm">{{ message }}</p>
    <p class="text-xs text-red-700 dark:text-red-400 mt-1">Please check your email address and try again.</p>
  </div>
</div>
{% endif %}
